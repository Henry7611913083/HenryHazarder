[project]
name = "nsfw-attack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.40",
    "pillow>=10.0",
    "lpips>=0.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
]

# ── ruff ──────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long — ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["nsfw_attack"]

# ── pyright ───────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# torch 타입 스텁이 불완전하므로 외부 라이브러리 오류는 무시
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
