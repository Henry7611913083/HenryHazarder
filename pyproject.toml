[project]
name = "classifier-attack"
version = "0.2.0"  # ✓ 업데이트
description = "Generic adversarial attack against image classifiers using transformers and accelerate"
readme = "readme.md"  # ✓ 추가
requires-python = ">=3.12"
authors = [
    {name = "HenryHazarder", email = "your-email@example.com"}  # ✓ 추가
]
license = {text = "MIT"}  # ✓ 추가
keywords = ["nsfw", "adversarial", "attack", "transformers"]  # ✓ 추가
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40",
    "pillow>=10.0",
    "lpips>=0.1.4",
    "accelerate>=0.28",
    "tqdm>=4.65",
    "timm>=0.9.0",         # ← timm 백엔드 지원을 위해 추가
    "open-clip-torch",     # ← CLIP/SigLIP 백엔드 지원을 위해 추가
    "scipy>=1.10.0",       # ← --preserve-hf 옵션(DCT 고주파)을 위해 추가
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
    "pytest>=7.4",  # ✓ 테스트용
]
cuda = [
    "torch[cuda-12]>=2.0.0",  # ✓ CUDA 12 지원
]
rocm = [
    "torch[rocm-6.0]>=2.0.0",  # ✓ ROCm 지원
]

[project.urls]
Homepage = "https://github.com/Henry7611913083/HenryHazarder"
Repository = "https://github.com/Henry7611913083/HenryHazarder.git"
Issues = "https://github.com/Henry7611913083/HenryHazarder/issues"

[build-system]
requires = ["hatchling"]  # ✓ 추가
build-backend = "hatchling.build"  # ✓ 추가

# ── ruff ──────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long — ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["classifier_attack"]

# ── pyright ───────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false